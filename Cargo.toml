[package]
name = "iris"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[dependencies]
bifrost = { path = "../bifrost/crates/bifrost" }
bifrost-iroh = { path = "../bifrost/crates/transports/bifrost-iroh" }
bifrost-wire = { path = "../bifrost/crates/bifrost-wire" }
clap = { version = "4", features = ["derive"] }
eyre = "0.6"
rand = "0.8"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
